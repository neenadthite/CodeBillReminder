name: Bill Reminder

on:
  workflow_dispatch:

  schedule:
    - cron: '30 2 * * *'

jobs:
  reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: C_Code

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libcurl4-openssl-dev

      - name: Build application
        working-directory: CodeBillReminder
        run: |
          gcc -std=c17 -Wall -Wextra \
            -Iinclude \
            -Iexternal/sqlite \
            src/main.c \
            src/bill.c \
            src/bill_manager.c \
            src/bill_ui.c \
            src/database.c \
            src/date.c \
            src/email_config.c \
            src/notification.c \
            src/notification_manager.c \
            src/reminder.c \
            external/sqlite/sqlite3.c \
            -lcurl \
            -o CodeBillReminder
       
      - name: Create email configuration
        working-directory: CodeBillReminder
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          mkdir -p config
          cat > config/email.conf <<EOF
          SMTP_HOST=$SMTP_HOST
          SMTP_PORT=$SMTP_PORT
          SMTP_USERNAME=$SMTP_USERNAME
          SMTP_PASSWORD=$SMTP_PASSWORD
          EMAIL_FROM=$EMAIL_FROM
          EMAIL_TO=$EMAIL_TO
          EOF

      - name: Run reminder check
        working-directory: CodeBillReminder
        run: |
          ./CodeBillReminder --check-reminders