name: Bill Reminder

on:
  workflow_dispatch:

  schedule:
    - cron: '30 2 * * *'

jobs:
  reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: C_Code

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libcurl4-openssl-dev

      - name: Build application
        run: |
          gcc -std=c17 -Wall -Wextra \
            -Iinclude \
            -Iexternal/sqlite \
            src/main.c \
            src/bill.c \
            src/bill_manager.c \
            src/bill_ui.c \
            src/database.c \
            src/date.c \
            src/email_config.c \
            src/notification.c \
            src/notification_manager.c \
            src/reminder.c \
            external/sqlite/sqlite3.c \
            -lcurl \
            -o CodeBillReminder

      - name: Run reminder check
        run: |
          ./CodeBillReminder --check-reminders